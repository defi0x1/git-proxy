# cargo-deny: run `cargo deny check` before adding a dependency.

[graph]
all-features = true

[advisories]
# RustSec advisories. Unmaintained crates fail too; add an `ignore` entry with a reason to accept one.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licenses only. Widen this list in a PR with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla root certificate data in webpki-roots (via reqwest with rustls).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
